<footer class="container footer">
  <div class="footer-top">
    <!-- Left: brand / meta -->
    <div class="footer-brandblock">
      <div class="footer-brand">BOSSB CO</div>
      <p class="muted footer-tagline">Handcrafted bouquets. Thoughtful delivery.</p>

      <div class="footer-meta">
        <div class="muted"><strong>Hours:</strong> Mon–Sat, 08:00–18:00</div>
        <div class="muted"><strong>Area:</strong> Johannesburg (selected areas)</div>
      </div>
    </div>

    <!-- Right: columns -->
    <div class="footer-cols" aria-label="Footer navigation">
      <div class="footer-col">
        <div class="footer-coltitle">Shop</div>
        <div class="footer-collinks">
          <a href="./bouquets.html">Bouquets</a>
          <a href="./cart.html">Cart</a>
        </div>
      </div>

      <div class="footer-col">
        <div class="footer-coltitle">Company</div>
        <div class="footer-collinks">
          <a href="./about.html">About</a>
          <a href="./why-us.html">Why us</a>
          <a href="./policy.html">Policy</a>
        </div>
      </div>

      <div class="footer-col">
        <div class="footer-coltitle">Contact</div>
        <div class="footer-collinks">
          <a href="#" id="footerWhatsAppLink" rel="noopener">
            <i class="fa-brands fa-whatsapp" aria-hidden="true"></i>
            <span style="margin-left:8px;">WhatsApp us</span>
          </a>

          <a href="#" id="footerInstagramLink" rel="noopener" target="_blank">
            <i class="fa-brands fa-instagram" aria-hidden="true"></i>
            <span style="margin-left:8px;">Instagram</span>
          </a>

          <a href="#" id="footerTikTokLink" rel="noopener" target="_blank">
            <i class="fa-brands fa-tiktok" aria-hidden="true"></i>
            <span style="margin-left:8px;">TikTok</span>
          </a>

          <a href="#" id="footerFacebookLink" rel="noopener" target="_blank">
            <i class="fa-brands fa-facebook" aria-hidden="true"></i>

          </a>

  </div>

  <div class="footer-bottom">
    <div>© <span id="footerYear"></span> BOSSB CO</div>
    <div><a href="./policy.html">Privacy</a> · <a href="./policy.html">Terms</a></div>
  </div>
</footer>

<script type="module">
  import { SHOP } from "./js/data.js";

  // WhatsApp (existing)
  const wa = document.querySelector("#footerWhatsAppLink");
  if (wa) {
    wa.href = `https://wa.me/${SHOP.whatsappNumber}`;
    wa.target = "_blank";
  }

  // Socials (replace with real URLs when ready)
  const ig = document.querySelector("#footerInstagramLink");
  if (ig) ig.href = "https://www.instagram.com/";

  const tt = document.querySelector("#footerTikTokLink");
  if (tt) tt.href = "https://www.tiktok.com/";

  const fb = document.querySelector("#footerFacebookLink");
  if (fb) fb.href = "https://www.facebook.com/";

  // Year
  const y = document.querySelector("#footerYear");
  if (y) y.textContent = String(new Date().getFullYear());
</script>
